<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrickBase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-deep:#000000; --pitch-mid:#141414; --seam-red:#E60D16; --gold:#FC1D18;
    --cream:#FFFFFF; --safe:#4C9A5A; --amber:#D99A2B; --danger:#E60D16;
    --card-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, var(--pitch-mid), var(--pitch-deep) 60%);
    color:var(--cream);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .backbtn{background:none;border:none;color:var(--cream);font-family:'Poppins';font-size:0.85rem;
    text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 4px;}
  .backbtn:hover{color:var(--gold);}
  .logo{width:44px;height:44px;border-radius:12px;
    background:var(--pitch-mid);
    display:flex;align-items:center;justify-content:center;
    flex:none;box-shadow:0 2px 8px rgba(0,0,0,0.4);}
  .logo img{width:34px;height:34px;object-fit:contain;display:block;}
  .titlewrap h1{font-family:'Poppins';font-weight:800;font-size:1.3rem;margin:0;text-transform:uppercase;letter-spacing:.02em;}
  .titlewrap span{display:block;font-size:.65rem;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;}
  .personalise-btn{width:38px;height:38px;border-radius:50%;background:rgba(252,29,24,0.12);
    border:1px solid rgba(252,29,24,0.4);color:var(--gold);font-size:1rem;cursor:pointer;}

  .card{background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--card-shadow);}
  .card h2{font-family:'Poppins';font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px;}
  .card .sub{color:rgba(255,255,255,0.6);font-size:.82rem;margin-bottom:14px;}
  .muted{color:rgba(255,255,255,.55);}

  /* Home tiles */
  .tile{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;padding:20px;margin-bottom:12px;cursor:pointer;color:var(--cream);
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    font-family:'Poppins';text-transform:uppercase;letter-spacing:.03em;transition:transform .1s;}
  .tile:hover{transform:translateY(-2px);border-color:rgba(252,29,24,.4);}
  .tile.primary{padding:34px 20px;font-size:1.3rem;text-align:center;
    background:linear-gradient(160deg, rgba(230,13,22,0.18), rgba(230,13,22,0.05));
    border-color:rgba(230,13,22,.4);}
  .tile .tilesub{display:block;font-family:'IBM Plex Sans';text-transform:none;letter-spacing:0;
    font-size:.78rem;color:rgba(255,255,255,.55);margin-top:4px;font-weight:400;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    font-family:'Poppins';font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;font-weight:500;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;}
  .status-safe{background:rgba(76,154,90,.15);color:#8fd39c;} .status-safe .dot{background:var(--safe);}
  .status-amber{background:rgba(217,154,43,.15);color:#f3c56a;} .status-amber .dot{background:var(--amber);}
  .status-danger{background:rgba(230,13,22,.18);color:#f0958d;} .status-danger .dot{background:var(--danger);}

  .form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px;}
  .field label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.55);}
  input,select,textarea{background:rgba(0,0,0,0.25);color:var(--cream);border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;padding:9px 10px;font-family:'IBM Plex Sans';font-size:.88rem;width:100%;}
  textarea{resize:vertical;min-height:50px;}
  input[type=range]{padding:0;accent-color:var(--gold);}
  .btn{background:var(--seam-red);color:var(--cream);border:none;border-radius:9px;padding:10px 16px;
    font-family:'Poppins';font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem;cursor:pointer;}
  .btn.ghost{background:transparent;border:1px solid rgba(252,29,24,.5);color:var(--gold);}
  .btn.block{width:100%;}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);font-size:.78rem;
    cursor:pointer;background:rgba(0,0,0,0.15);}
  .chip.active{background:var(--gold);color:var(--pitch-deep);border-color:var(--gold);font-weight:600;}

  table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:4px;}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid rgba(255,255,255,0.08);}
  th{color:var(--gold);font-family:'Poppins';font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:.68rem;}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono';}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:6px;}
  .stat-box{background:rgba(0,0,0,0.2);border-radius:10px;padding:11px;text-align:center;}
  .stat-box .v{font-family:'Poppins';font-size:1.3rem;font-weight:600;}
  .stat-box .l{font-size:.64rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em;}

  .dial-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .dial-wrap{position:relative;width:180px;height:104px;flex:none;}
  .dial-label{position:absolute;bottom:0;left:0;right:0;text-align:center;}
  .dial-label .num{font-family:'Poppins';font-size:1.7rem;font-weight:600;}
  .dial-label .unit{font-size:.62rem;color:rgba(255,255,255,.6);letter-spacing:.06em;text-transform:uppercase;}

  .flag-note{font-size:.82rem;line-height:1.5;margin-top:10px;padding:11px 12px;border-radius:10px;
    background:rgba(0,0,0,0.2);border-left:3px solid var(--gold);}
  .coach-flag{display:flex;gap:9px;margin-top:12px;padding:11px 12px;background:rgba(230,13,22,0.12);
    border:1px solid rgba(230,13,22,0.35);border-radius:10px;font-size:.82rem;}
  .doctor-flag{display:flex;gap:9px;margin-top:12px;padding:11px 12px;background:rgba(230,13,22,0.22);
    border:1px solid rgba(230,13,22,0.55);border-radius:10px;font-size:.85rem;font-weight:600;}

  .video-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;
    background:rgba(0,0,0,0.18);margin-bottom:8px;}
  .video-thumb{width:56px;height:40px;border-radius:6px;flex:none;
    background:repeating-linear-gradient(45deg, rgba(252,29,24,0.15), rgba(252,29,24,0.15) 6px, rgba(0,0,0,0.15) 6px, rgba(0,0,0,0.15) 12px);
    display:flex;align-items:center;justify-content:center;font-size:.9rem;}
  .video-meta strong{font-size:.85rem;display:block;} .video-meta span{font-size:.7rem;color:rgba(255,255,255,.5);}
  .placeholder-tag{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--gold);border:1px solid rgba(252,29,24,.4);border-radius:6px;padding:2px 6px;margin-left:8px;}

  .plan-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.07);}
  .plan-item:last-child{border-bottom:none;}
  .plan-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--seam-red);}
  .plan-item.done label{text-decoration:line-through;opacity:.5;}
  .plan-item label{flex:1;cursor:pointer;font-size:.88rem;}

  .chat-launch{display:flex;align-items:center;gap:12px;padding:16px;border-radius:999px;
    background:linear-gradient(90deg, rgba(252,29,24,0.15), rgba(252,29,24,0.05));
    border:1px solid rgba(252,29,24,.35);cursor:pointer;margin-top:6px;}
  .chat-launch .bubble-icon{font-size:1.3rem;}
  .chat-launch .txt{font-family:'Poppins';text-transform:uppercase;font-size:.85rem;letter-spacing:.03em;}
  .chat-launch .txt span{display:block;font-family:'IBM Plex Sans';text-transform:none;font-size:.72rem;color:rgba(255,255,255,.55);}

  .chat-window{display:flex;flex-direction:column;height:56vh;min-height:340px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:.85rem;line-height:1.5;}
  .msg.user{align-self:flex-end;background:var(--seam-red);color:var(--cream);border-bottom-right-radius:3px;}
  .msg.assistant{align-self:flex-start;background:rgba(255,255,255,0.08);border-bottom-left-radius:3px;}
  .msg.system-note{align-self:center;font-size:.72rem;color:rgba(255,255,255,.45);text-align:center;}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;}
  .chat-input-row input{flex:1;}
  .typing{align-self:flex-start;font-size:.78rem;color:rgba(255,255,255,.5);padding:0 4px;}

  .empty{text-align:center;padding:20px 8px;color:rgba(255,255,255,.45);font-size:.85rem;}
  .icon-btn{background:transparent;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:.85rem;padding:2px 5px;}
  .icon-btn:hover{color:var(--danger);}
  ::placeholder{color:rgba(255,255,255,.35);}
  a{color:var(--gold);}
  .unverified-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:#f0958d;
    border:1px solid rgba(230,13,22,.4);border-radius:6px;padding:2px 6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <div id="panel"></div>
</div>

<script>
(function(){
  const ECB_MATCH_LIMITS = {
    "Up to U13": { spell:5, day:10 },
    "U14/U15":   { spell:6, day:12 },
    "U16-U19":   { spell:7, day:18 },
    "Senior":    { spell:null, day:null }
  };
  const ECB_PRACTICE_LIMITS = {
    "Up to U13": { balls:30, sessions:2 },
    "U14/U15":   { balls:36, sessions:2 },
    "U16-U19":   { balls:36, sessions:3 },
    "Senior":    { balls:null, sessions:null }
  };
  const AGE_BANDS = Object.keys(ECB_MATCH_LIMITS);
  const TEAM_OPTIONS = ["Club","School","District","County pathway","Other"];
  const STORAGE_KEY = "crickbase-state-v2";
  const AI_ENABLED = false;   // Claude API needs a key, so AI features are demo-version only on the public site

  let state = {
    ageBand: "U14/U15",
    teams: ["Club"],
    workloadLog: [],   // {date, overs, team, _id}
    matchLog: [],       // {date, runs, wickets, overs, team, _id}
    plan: defaultPlan(),
    checkins: []        // weekly check-ins, Section B subset
  };
  let view = "home";        // home | logOvers | injury | stats | chat | personalise
  let showPersonalise = false;
  let chatMessages = [
    { role:"system-note", text:"This chat can discuss your logged workload and training plan against ECB guidance. It can't diagnose injuries or prescribe treatment — persistent pain always means see a doctor or physio." }
  ];
  let chatBusy = false;
  let saveTimer = null;
  let postLogFlow = null;   // { date, dayTotal, dayLimit, overLimit, noteSaved, advice }
  let postLogBusy = false;

  function defaultPlan(){
    return [
      { id:"p1", text:"Dynamic warm-up before every net session", done:false },
      { id:"p2", text:"2x skills session (batting or bowling focus)", done:false },
      { id:"p3", text:"1x fielding/fitness session", done:false },
      { id:"p4", text:"1 full rest day with no bowling", done:false },
      { id:"p5", text:"Cool-down stretches after match day", done:false }
    ];
  }

  async function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = Object.assign(state, JSON.parse(raw));
    }catch(e){}
    render();
  }
  function queueSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    }, 250);
  }

  function isoDate(d){ return d.toISOString().slice(0,10); }
  function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d; }
  function withinLast(dateStr,n){ return new Date(dateStr+"T00:00:00") >= daysAgo(n); }

  function workloadStatus(){
    const limits = ECB_MATCH_LIMITS[state.ageBand];
    const last7 = state.workloadLog.filter(e=>withinLast(e.date,7)).sort((a,b)=>a.date.localeCompare(b.date));
    const daysBowled = [...new Set(last7.map(e=>e.date))].sort();
    const maxDayOvers = last7.reduce((m,e)=>Math.max(m,e.overs),0);
    const totalOvers7d = last7.reduce((s,e)=>s+e.overs,0);
    let maxConsecutive=0, run=0, prev=null;
    daysBowled.forEach(d=>{
      if(prev){ const diff=(new Date(d)-new Date(prev))/86400000; run = diff===1? run+1:1; } else run=1;
      maxConsecutive = Math.max(maxConsecutive, run); prev=d;
    });
    let level="safe", reasons=[];
    if(limits.day!==null && maxDayOvers>limits.day){ level="danger";
      reasons.push(`A single day exceeded the ECB ${state.ageBand} limit of ${limits.day} overs/day.`); }
    if(daysBowled.length>4){ level="danger";
      reasons.push(`Bowled on ${daysBowled.length} days in the last 7 — ECB guidance recommends a max of 4.`); }
    if(maxConsecutive>2){ if(level!=="danger") level="amber";
      reasons.push(`${maxConsecutive} bowling days in a row — guidance recommends avoiding more than 2 in a row.`); }
    if(reasons.length===0) reasons.push("Workload is within ECB match-day guidance based on what's been logged, across all your teams.");
    return { level, reasons, totalOvers7d, daysBowled: daysBowled.length, limits };
  }

  function statusMeta(level){
    if(level==="danger") return {cls:"status-danger", text:"Over guidance", color:"#E60D16"};
    if(level==="amber") return {cls:"status-amber", text:"Approaching limit", color:"#D99A2B"};
    return {cls:"status-safe", text:"Within guidance", color:"#4C9A5A"};
  }

  function dialSVG(pct,color){
    const r=72, cx=90, cy=90;
    function pt(a){ return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
    const [sx,sy]=pt(Math.PI); const [ex,ey]=pt(Math.PI - Math.PI*Math.min(pct,0.999));
    const largeArc = pct>0.5?1:0;
    return `<svg viewBox="0 0 180 100" width="180" height="106" role="img" aria-label="Workload dial">
      <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="13" stroke-linecap="round"/>
      <path d="M ${sx} ${sy} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey}" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"/>
    </svg>`;
  }

  /* ---------- Router / render ---------- */
  function goto(v){ view=v; showPersonalise=false; if(v!=="logOvers") postLogFlow=null; render(); window.scrollTo(0,0); }

  function render(){
    renderTopbar();
    const panel = document.getElementById("panel");
    if(showPersonalise){ panel.innerHTML = personaliseView(); bindPersonalise(); return; }
    if(view==="home") panel.innerHTML = homeView();
    else if(view==="logOvers") panel.innerHTML = logOversView();
    else if(view==="injury") panel.innerHTML = injuryView();
    else if(view==="stats") panel.innerHTML = statsView();
    else if(view==="chat") panel.innerHTML = chatView();
    bindEvents();
    if(view==="chat") scrollChatToBottom();
  }

  function renderTopbar(){
    const bar = document.getElementById("topbar");
    if(view==="home"){
      bar.innerHTML = `

  /* ---------- Home ---------- */
  function homeView(){
    const ws = workloadStatus();
    const meta = statusMeta(ws.level);
    return `
      <button class="tile" data-go="logOvers">
        Log my overs
        <span class="tilesub">Add overs across every team — club, school, district, county</span>
      </button>
      <button class="tile primary" data-go="injury">
        Injury prevention
        <span class="tilesub" style="text-align:center;">
          <span class="status-pill ${meta.cls}" style="margin-top:6px;"><span class="dot"></span>${meta.text}</span>
        </span>
      </button>
      <button class="tile" data-go="stats">
        Stats
        <span class="tilesub">Match history, runs, wickets, season summary</span>
      </button>
    `;
  }

  function bindPersonalise(){
    document.getElementById("ageBandSel").onchange = e=>{ state.ageBand=e.target.value; queueSave(); };
    document.querySelectorAll("[data-team]").forEach(chip=>{
      chip.onclick = ()=>{
        const t = chip.getAttribute("data-team");
        state.teams = state.teams.includes(t) ? state.teams.filter(x=>x!==t) : [...state.teams, t];
        queueSave(); render();
      };
    });
    document.getElementById("closePersonalise").onclick = ()=>{ showPersonalise=false; render(); };
  }

    if(overLimit){
      return `
        <div class="card">
          <h2>Above today's ECB limit</h2>
          <div class="sub">Logged ${dayTotal} overs on ${date} — the ${state.ageBand} limit is ${dayLimit} overs/day.</div>
          ${postLogFlow.advice ? `
            <div class="${postLogFlow.escalate ? 'doctor-flag' : 'flag-note'}">${postLogFlow.advice}</div>
          ` : `
            <div class="form-row">
              <div class="field"><label for="plSpell">Longest spell today (overs)</label><input type="number" id="plSpell" min="0" step="0.1"></div>
              <div class="field"><label for="plRpe">How hard did it feel? RPE <span id="plRpeVal">5</span>/10</label><input type="range" id="plRpe" min="1" max="10" value="5"></div>
            </div>
            <div class="field" style="margin-bottom:8px;">
              <label>Any pain today?</label>
              <div class="chiprow"><div class="chip" id="olPainYes">Yes</div><div class="chip active" id="olPainNo">No</div></div>
            </div>
            <div id="olPainDetails" style="display:none;">
              <div class="form-row">
                <div class="field" style="flex:2;"><label for="olPainLoc">Where?</label><input type="text" id="olPainLoc" placeholder="e.g. lower back"></div>
                <div class="field"><label for="olPainSeverity">Severity <span id="olSevVal">4</span>/10</label><input type="range" id="olPainSeverity" min="1" max="10" value="4"></div>
              </div>
              <div class="field" style="margin-bottom:12px;">
                <label for="olPainPattern">Pattern</label>
                <select id="olPainPattern">
                  <option>Worse when bowling, better when resting</option>
                  <option>Same regardless</option>
                  <option>Getting worse over time</option>
                  <option>One-off, already easing</option>
                </select>
              </div>
            </div>
            <button class="btn block" id="getAdvice" ${postLogBusy?"disabled":""}>${postLogBusy?"Checking…":"Get tailored advice"}</button>
          `}
        </div>`;
    }

    return `
      <div class="card">
        <h2>Logged ✓</h2>
        <div class="sub">${dayTotal} overs on ${date} — within the ${state.ageBand} limit of ${dayLimit ?? "N/A"} overs/day.</div>
        ${postLogFlow.noteSaved ? `
          <div class="${postLogFlow.escalate ? 'doctor-flag' : 'flag-note'}">${postLogFlow.resultText}</div>
        ` : `
          <div class="field" style="margin-bottom:8px;">
            <label>Anything paining you today?</label>
            <div class="chiprow"><div class="chip" id="plPainYes">Yes</div><div class="chip active" id="plPainNo">No</div></div>
          </div>
          <div id="plPainDetails" style="display:none;">
            <div class="form-row">
              <div class="field" style="flex:2;"><label for="plPainLoc">Where?</label><input type="text" id="plPainLoc" placeholder="e.g. shoulder"></div>
              <div class="field"><label for="plPainSeverity">Severity <span id="plSevVal">4</span>/10</label><input type="range" id="plPainSeverity" min="1" max="10" value="4"></div>
            </div>
            <div class="field" style="margin-bottom:12px;">
              <label for="plPainPattern">Pattern</label>
              <select id="plPainPattern">
                <option>Worse when bowling, better when resting</option>
                <option>Same regardless</option>
                <option>Getting worse over time</option>
                <option>One-off, already easing</option>
              </select>
            </div>
            <button class="btn block" id="savePainNote">Save note</button>
          </div>
        `}
      </div>`;
  }

  function isConcerningPain(severity, pattern){
    return severity >= 4 || pattern === "Worse when bowling, better when resting" || pattern === "Getting worse over time";
  }

  async function requestTailoredAdvice(){
    if(!postLogFlow || postLogBusy) return;
    const spellEl = document.getElementById("plSpell");
    const rpeEl = document.getElementById("plRpe");
    const spell = spellEl ? parseFloat(spellEl.value||"0") : 0;
    const rpe = rpeEl ? parseInt(rpeEl.value,10) : 5;
    const hasPain = document.getElementById("olPainYes") && document.getElementById("olPainYes").classList.contains("active");
    const severity = hasPain ? parseInt(document.getElementById("olPainSeverity").value,10) : 0;
    const pattern = hasPain ? document.getElementById("olPainPattern").value : "";
    const location = hasPain ? document.getElementById("olPainLoc").value.trim() : "";

    // Safety-critical branch decided deterministically in code, not left to the model.
    if(hasPain && isConcerningPain(severity, pattern)){
      postLogFlow.escalate = true;
      postLogFlow.advice = "See a doctor or physiotherapist.";
      chatMessages.push({ role:"user", text:`Logged ${postLogFlow.dayTotal} overs today, over my ${postLogFlow.dayLimit}-over limit, with pain (${location||"unspecified location"}, ${severity}/10, ${pattern}).` });
      chatMessages.push({ role:"assistant", text:"See a doctor or physiotherapist." });
      render();
      return;
    }

    if(!AI_ENABLED){
      postLogFlow.escalate = false;
      postLogFlow.advice = "Tailored advice is only available in the demo version.";
      render();
      return;
    }

    postLogBusy = true; render();
    const systemPrompt = `You are CrickBase's in-app assistant. A junior player has just logged a day's bowling that exceeds the ECB daily overs limit for their age group. Give ONE short, specific, tailored recommendation (2-3 sentences) about training load — e.g. what to prioritise before the next session, how to adjust upcoming load, when it's reasonable to bowl again. Do NOT just say "relax" or "take it easy" with no specifics. NEVER prescribe stretches, exercises or treatment, and NEVER say they are "safe/fine/low risk" — this player has no reported pain right now, but you are advising on workload only, not their physical condition.

Player context: age group ${state.ageBand}, teams: ${state.teams.join(", ")||"none set"}. Logged ${postLogFlow.dayTotal} overs on ${postLogFlow.date} against an ECB limit of ${postLogFlow.dayLimit} overs/day. Longest spell today: ${spell} overs. Session RPE: ${rpe}/10. No pain reported.`;
    const userMsg = `I bowled ${postLogFlow.dayTotal} overs today (over my ${postLogFlow.dayLimit}-over limit), longest spell ${spell} overs, RPE ${rpe}/10, no pain. What should I do?`;

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system: systemPrompt,
          messages: [{ role:"user", content:userMsg }]
        })
      });
      const data = await response.json();
      const textOut = (data.content||[]).map(b=>b.text||"").join("\n").trim() || "Couldn't get advice right now — try again.";
      postLogFlow.escalate = false;
      postLogFlow.advice = textOut;
      chatMessages.push({ role:"user", text:userMsg });
      chatMessages.push({ role:"assistant", text:textOut });
    }catch(e){
      postLogFlow.escalate = false;
      postLogFlow.advice = "Couldn't reach the assistant just now — try again in a moment, or check in with a coach directly.";
    }
    postLogBusy = false; render();
  }

  /* ---------- Injury prevention ---------- */
  function injuryView(){
    const ws = workloadStatus();
    const meta = statusMeta(ws.level);
    const pct = ws.limits.day ? Math.min(ws.totalOvers7d/(ws.limits.day*2),1) : 0.15;
    const lastCheckin = [...state.checkins].sort((a,b)=>b.date.localeCompare(a.date))[0];

    return `
      <div class="card">
        <h2>7-day workload — all teams combined</h2>
        <div class="sub">${state.teams.length? state.teams.join(" + ") : "No teams set"} · vs. ECB ${state.ageBand} guidance</div>
        <div class="dial-row">
          <div class="dial-wrap">${dialSVG(pct, meta.color)}
            <div class="dial-label"><div class="num">${ws.totalOvers7d}</div><div class="unit">overs / 7d</div></div>
          </div>
          <div style="flex:1;min-width:180px;">
            <span class="status-pill ${meta.cls}"><span class="dot"></span>${meta.text}</span>
            ${ws.level!=="safe" ? `<div class="coach-flag">⚠️ ${ws.reasons.join(" ")} Worth a check-in with a coach before the next session.</div>`
                                 : `<div class="flag-note">${ws.reasons.join(" ")}</div>`}
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Weekly check-in <span class="unverified-tag">Not a diagnosis</span></h2>
        <div class="sub">Quick questions to flag anything worth a coach or physio's attention. This app never says "you're fine" — only what the week looked like.</div>
        ${lastCheckin ? `<div class="muted" style="font-size:.78rem;margin-bottom:10px;">Last check-in: ${lastCheckin.date}</div>` : ""}
        <div class="form-row">
          <div class="field"><label for="ciMatchOvers">Overs in matches this week</label><input type="number" id="ciMatchOvers" min="0" step="0.1"></div>
          <div class="field"><label for="ciNetBalls">Balls in nets/practice this week</label><input type="number" id="ciNetBalls" min="0"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="ciDays">Days bowled this week (0–7)</label><input type="number" id="ciDays" min="0" max="7"></div>
          <div class="field"><label for="ciRest">Full rest days (0–7)</label><input type="number" id="ciRest" min="0" max="7"></div>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label for="ciRpe">How hard did this week feel? (RPE, 1 easy – 10 max effort): <span id="rpeVal">5</span></label>
          <input type="range" id="ciRpe" min="1" max="10" value="5">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label for="ciSleep">Average hours of sleep this week: <span id="sleepVal">8</span></label>
          <input type="range" id="ciSleep" min="3" max="11" value="8">
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label>Any pain right now?</label>
          <div class="chiprow"><div class="chip" id="painYes">Yes</div><div class="chip active" id="painNo">No</div></div>
        </div>
        <div id="painDetails" style="display:none;">
          <div class="form-row">
            <div class="field" style="flex:2;"><label for="ciPainLoc">Where?</label><input type="text" id="ciPainLoc" placeholder="e.g. lower back"></div>
            <div class="field"><label for="ciPainSeverity">Severity (1–10)</label><input type="range" id="ciPainSeverity" min="1" max="10" value="4"></div>
          </div>
          <div class="field" style="margin-bottom:12px;">
            <label>Pattern</label>
            <select id="ciPainPattern">
              <option>Worse when bowling, better when resting</option>
              <option>Same regardless</option>
              <option>Getting worse over time</option>
              <option>One-off, already easing</option>
            </select>
          </div>
        </div>
        <button class="btn block" id="submitCheckin">Save check-in</button>
        <div id="checkinResult"></div>
      </div>

      <div class="card">
        <h2>Training plan</h2>
        ${state.plan.map(p=>`
          <div class="plan-item ${p.done?"done":""}">
            <input type="checkbox" id="chk-${p.id}" ${p.done?"checked":""} data-plan="${p.id}">
            <label for="chk-${p.id}">${p.text}</label>
          </div>`).join("")}
      </div>

      ${AI_ENABLED ? `<div class="chat-launch" id="goChat">
        <div class="bubble-icon">💬</div>
        <div class="txt">Chat about workload or training plans<span>Ask questions grounded in your logged data — no diagnosis, no treatment advice</span></div>
      </div>` : `<div class="chat-launch" style="cursor:default;">
        <div class="bubble-icon">💬</div>
        <div class="txt">Chat about workload or training plans<span>Chat is only available in the demo version.</span></div>
      </div>`}
    `;
  }

  /* ---------- Stats ---------- */
  function statsView(){
    const rows = [...state.matchLog].sort((a,b)=>b.date.localeCompare(a.date));
    const totalRuns = rows.reduce((s,r)=>s+r.runs,0);
    const totalWkts = rows.reduce((s,r)=>s+r.wickets,0);
    const totalOvers = rows.reduce((s,r)=>s+r.overs,0);
    const avgRuns = rows.length ? (totalRuns/rows.length).toFixed(1) : "—";
    const economy = totalOvers>0 ? (totalRuns/totalOvers).toFixed(2) : "—";
    return `
      <div class="card">
        <h2>Season summary</h2>
        <div class="stat-grid">
          <div class="stat-box"><div class="v">${rows.length}</div><div class="l">Matches</div></div>
          <div class="stat-box"><div class="v">${totalRuns}</div><div class="l">Runs</div></div>
          <div class="stat-box"><div class="v">${totalWkts}</div><div class="l">Wickets</div></div>
          <div class="stat-box"><div class="v">${avgRuns}</div><div class="l">Avg/match</div></div>
        </div>
      </div>
      <div class="card">
        <h2>Log a match</h2>
        <div class="form-row">
          <div class="field"><label for="mDate">Date</label><input type="date" id="mDate" value="${isoDate(new Date())}"></div>
          <div class="field"><label for="mTeam">Team</label><select id="mTeam">${(state.teams.length?state.teams:TEAM_OPTIONS).map(t=>`<option>${t}</option>`).join("")}</select></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="mRuns">Runs</label><input type="number" id="mRuns" min="0" placeholder="0"></div>
          <div class="field"><label for="mWkts">Wickets</label><input type="number" id="mWkts" min="0" placeholder="0"></div>
          <div class="field"><label for="mOvers">Overs bowled</label><input type="number" id="mOvers" min="0" step="0.1" placeholder="0"></div>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label for="mLink">Link to external scorecard <span class="placeholder-tag">Optional</span></label>
          <input type="text" id="mLink" placeholder="Paste scorecard link (e.g. league site)">
        </div>
        <button class="btn block" id="addMatch">Log match</button>
        <span class="muted" style="font-size:.75rem;display:block;margin-top:8px;">Overs here also feed your combined workload total.</span>
      </div>
      <div class="card">
        <h2>Match history</h2>
        ${rows.length ? `<table><thead><tr><th>Date</th><th>Team</th><th class="num">Runs</th><th class="num">Wkts</th><th></th></tr></thead><tbody>
          ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.team||"—"}</td><td class="num">${r.runs}</td><td class="num">${r.wickets}</td>
            <td><button class="icon-btn" data-del-match="${r._id}">✕</button></td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">No matches logged yet.</div>`}
      </div>
    `;
  }

  /* ---------- Chat ---------- */
  function chatView(){
    return `
      <div class="card" style="padding-bottom:14px;">
        <div class="chat-window">
          <div class="chat-msgs" id="chatMsgs">
            ${chatMessages.map(m=> m.role==="system-note" ? `<div class="msg system-note">${m.text}</div>`
              : `<div class="msg ${m.role}">${m.text}</div>`).join("")}
            ${chatBusy ? `<div class="typing">Thinking…</div>` : ""}
          </div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Ask about this week's workload or your plan…">
            <button class="btn" id="sendChat">Send</button>
          </div>
        </div>
      </div>
    `;
  }
  function scrollChatToBottom(){
    const el = document.getElementById("chatMsgs");
    if(el) el.scrollTop = el.scrollHeight;
  }

  function buildContextSummary(){
    const ws = workloadStatus();
    const lastCheckin = [...state.checkins].sort((a,b)=>b.date.localeCompare(a.date))[0];
    const doneCount = state.plan.filter(p=>p.done).length;
    return `Player context — age group: ${state.ageBand}; teams: ${state.teams.join(", ")||"none set"}.
7-day combined workload: ${ws.totalOvers7d} overs across ${ws.daysBowled} days. ECB limits for this age group: max ${ws.limits.day??"N/A"} overs/day, max ${ws.limits.spell??"N/A"} overs/spell. Status: ${ws.level}.
${lastCheckin ? `Latest weekly check-in (${lastCheckin.date}): RPE ${lastCheckin.rpe}/10, sleep ${lastCheckin.sleepHours}h avg, rest days ${lastCheckin.restDays}, pain reported: ${lastCheckin.pain && lastCheckin.pain.has ? `yes (${lastCheckin.pain.location}, severity ${lastCheckin.pain.severity}/10, ${lastCheckin.pain.pattern})` : "no"}.` : "No weekly check-in logged yet."}
Training plan: ${doneCount}/${state.plan.length} items completed this week.`;
  }

  async function sendChatMessage(text){
    chatMessages.push({ role:"user", text });
    chatBusy = true; render();

    const systemPrompt = `You are the in-app assistant for CrickBase, a workload and injury-prevention tool for junior cricketers. You may ONLY discuss workload patterns and training plans, grounded in the player context provided and published ECB Fast Bowling Directives. Non-negotiable rules:
1. NEVER say a player is "safe", "fine", "low risk", or give reassurance about injury risk. Only describe what the logged data shows compared with ECB guidance, and say a coach or physio should make the actual call.
2. NEVER prescribe treatment, exercises, stretches, or rest durations for pain. If the context or the player's message mentions pain that is persistent or worsening, respond with exactly one instruction: see a doctor or physiotherapist — and nothing else clinical.
3. Keep answers short (2-4 sentences), plain, and appropriate for a young teenager.
4. If asked something outside workload/training/injury-prevention scope, gently redirect back to those topics.

${buildContextSummary()}`;

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system: systemPrompt,
          messages: chatMessages.filter(m=>m.role==="user"||m.role==="assistant")
            .map(m=>({role:m.role, content:m.text}))
        })
      });
      const data = await response.json();
      const textOut = (data.content||[]).map(b=>b.text||"").join("\n").trim() || "Sorry, I couldn't process that — try asking again.";
      chatMessages.push({ role:"assistant", text: textOut });
    }catch(e){
      chatMessages.push({ role:"assistant", text:"Something went wrong reaching the assistant. Try again in a moment." });
    }
    chatBusy = false; render();
  }

  /* ---------- Events ---------- */
  function bindEvents(){
    const gp = document.getElementById("openPersonalise");
    if(gp) gp.onclick = ()=>{ showPersonalise=true; render(); };
    const gh = document.getElementById("goHome");
    if(gh) gh.onclick = ()=> goto("home");
    document.querySelectorAll("[data-go]").forEach(btn=>{
      btn.onclick = ()=> goto(btn.getAttribute("data-go"));
    });
    const goChat = document.getElementById("goChat");
    if(goChat) goChat.onclick = ()=> goto("chat");

    // Log overs
    const addW = document.getElementById("addWorkload");
    if(addW) addW.onclick = ()=>{
      const date = document.getElementById("wDate").value;
      const overs = parseFloat(document.getElementById("wOvers").value);
      const team = document.getElementById("wTeam").value;
      if(!date || isNaN(overs) || overs<0) return;
      state.workloadLog.push({ date, overs, team, _id: Date.now() });
      queueSave();
      const dayLimit = ECB_MATCH_LIMITS[state.ageBand].day;
      const dayTotal = state.workloadLog.filter(e=>e.date===date).reduce((s,e)=>s+e.overs,0);
      postLogFlow = { date, dayTotal, dayLimit, overLimit: dayLimit!=null && dayTotal>dayLimit, noteSaved:false, advice:null };
      render();
    };
    document.querySelectorAll("[data-del-workload]").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute("data-del-workload");
        state.workloadLog = state.workloadLog.filter(e=>String(e._id)!==id);
        queueSave(); render();
      };
    });

    // Post-log flow: within-limit pain check
    const plPainYes = document.getElementById("plPainYes"), plPainNo = document.getElementById("plPainNo");
    if(plPainYes){
      plPainYes.onclick = ()=>{ plPainYes.classList.add("active"); plPainNo.classList.remove("active");
        document.getElementById("plPainDetails").style.display="block"; };
      plPainNo.onclick = ()=>{ plPainNo.classList.add("active"); plPainYes.classList.remove("active");
        document.getElementById("plPainDetails").style.display="none"; };
    }
    const plSev = document.getElementById("plPainSeverity");
    if(plSev) plSev.oninput = ()=> document.getElementById("plSevVal").textContent = plSev.value;
    const savePainNote = document.getElementById("savePainNote");
    if(savePainNote) savePainNote.onclick = ()=>{
      const severity = parseInt(document.getElementById("plPainSeverity").value,10);
      const pattern = document.getElementById("plPainPattern").value;
      const escalate = isConcerningPain(severity, pattern);
      if(postLogFlow){
        postLogFlow.noteSaved = true;
        postLogFlow.escalate = escalate;
        postLogFlow.resultText = escalate
          ? "See a doctor or physiotherapist."
          : "Noted — keep an eye on it and mention it to a coach if it doesn't settle down.";
      }
      render();
    };

    // Post-log flow: over-limit — pain toggle
    const olPainYes = document.getElementById("olPainYes"), olPainNo = document.getElementById("olPainNo");
    if(olPainYes){
      olPainYes.onclick = ()=>{ olPainYes.classList.add("active"); olPainNo.classList.remove("active");
        document.getElementById("olPainDetails").style.display="block"; };
      olPainNo.onclick = ()=>{ olPainNo.classList.add("active"); olPainYes.classList.remove("active");
        document.getElementById("olPainDetails").style.display="none"; };
    }
    const olSev = document.getElementById("olPainSeverity");
    if(olSev) olSev.oninput = ()=> document.getElementById("olSevVal").textContent = olSev.value;

    // Post-log flow: over-limit tailored advice
    const plRpe = document.getElementById("plRpe");
    if(plRpe) plRpe.oninput = ()=> document.getElementById("plRpeVal").textContent = plRpe.value;
    const getAdvice = document.getElementById("getAdvice");
    if(getAdvice) getAdvice.onclick = ()=> requestTailoredAdvice();

    // Stats / matches
    const addM = document.getElementById("addMatch");
    if(addM) addM.onclick = ()=>{
      const date = document.getElementById("mDate").value;
      const team = document.getElementById("mTeam").value;
      const runs = parseInt(document.getElementById("mRuns").value||"0",10);
      const wickets = parseInt(document.getElementById("mWkts").value||"0",10);
      const overs = parseFloat(document.getElementById("mOvers").value||"0");
      const link = document.getElementById("mLink").value.trim();
      if(!date) return;
      const id = Date.now();
      state.matchLog.push({ date, team, runs, wickets, overs, link, _id:id });
      if(overs>0) state.workloadLog.push({ date, overs, team, _id:id+1 });
      queueSave(); render();
    };
    document.querySelectorAll("[data-del-match]").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute("data-del-match");
        state.matchLog = state.matchLog.filter(e=>String(e._id)!==id);
        queueSave(); render();
      };
    });

    // Training plan
    document.querySelectorAll("[data-plan]").forEach(chk=>{
      chk.onchange = ()=>{
        const id = chk.getAttribute("data-plan");
        state.plan = state.plan.map(p=> p.id===id ? {...p, done:chk.checked} : p);
        queueSave(); render();
      };
    });

    // Weekly check-in
    const rpe = document.getElementById("ciRpe");
    if(rpe) rpe.oninput = ()=> document.getElementById("rpeVal").textContent = rpe.value;
    const sleep = document.getElementById("ciSleep");
    if(sleep) sleep.oninput = ()=> document.getElementById("sleepVal").textContent = sleep.value;
    const painYes = document.getElementById("painYes"), painNo = document.getElementById("painNo");
    if(painYes){
      painYes.onclick = ()=>{ painYes.classList.add("active"); painNo.classList.remove("active");
        document.getElementById("painDetails").style.display="block"; };
      painNo.onclick = ()=>{ painNo.classList.add("active"); painYes.classList.remove("active");
        document.getElementById("painDetails").style.display="none"; };
    }
    const submitCi = document.getElementById("submitCheckin");
    if(submitCi) submitCi.onclick = ()=>{
      const hasPain = document.getElementById("painYes").classList.contains("active");
      const pattern = document.getElementById("ciPainPattern") ? document.getElementById("ciPainPattern").value : "";
      const checkin = {
        date: isoDate(new Date()),
        matchOvers: parseFloat(document.getElementById("ciMatchOvers").value||"0"),
        netBalls: parseInt(document.getElementById("ciNetBalls").value||"0",10),
        daysBowled: parseInt(document.getElementById("ciDays").value||"0",10),
        restDays: parseInt(document.getElementById("ciRest").value||"0",10),
        rpe: parseInt(document.getElementById("ciRpe").value,10),
        sleepHours: parseInt(document.getElementById("ciSleep").value,10),
        pain: hasPain ? {
          has:true,
          location: document.getElementById("ciPainLoc").value.trim(),
          severity: parseInt(document.getElementById("ciPainSeverity").value,10),
          pattern
        } : { has:false },
        _id: Date.now()
      };
      state.checkins.push(checkin);
      queueSave();
      const worsening = checkin.pain.has && (checkin.pain.pattern==="Getting worse over time" || checkin.pain.pattern==="Worse when bowling, better when resting");
      const resultEl = document.getElementById("checkinResult");
      if(worsening){
        resultEl.innerHTML = `<div class="doctor-flag">This pattern of pain — especially in the back and linked to bowling — is worth getting checked by a doctor or physiotherapist. Please see one before the next bowling session.</div>`;
      } else {
        resultEl.innerHTML = `<div class="flag-note">Check-in saved. This isn't a diagnosis — share it with a coach if anything feels off.</div>`;
      }
      render();
      // re-show result after render clears it
      setTimeout(()=>{
        const el = document.getElementById("checkinResult");
        if(el) el.innerHTML = worsening
          ? `<div class="doctor-flag">This pattern of pain — especially in the back and linked to bowling — is worth getting checked by a doctor or physiotherapist. Please see one before the next bowling session.</div>`
          : `<div class="flag-note">Check-in saved. This isn't a diagnosis — share it with a coach if anything feels off.</div>`;
      }, 0);
    };

    // Chat
    const sendBtn = document.getElementById("sendChat");
    const chatInput = document.getElementById("chatInput");
    if(sendBtn){
      sendBtn.onclick = ()=>{
        const val = chatInput.value.trim();
        if(!val || chatBusy) return;
        chatInput.value = "";
        sendChatMessage(val);
      };
    }
    if(chatInput){
      chatInput.onkeydown = (e)=>{ if(e.key==="Enter" && !chatBusy) sendBtn.click(); };
    }
  }

  loadState();
})();
</script>
</body>
</html>
